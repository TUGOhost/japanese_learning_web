name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install pytest

      - name: Test Python parser
        run: npm run test:python

      - name: Generate and validate content
        run: npm run content:all:japanese-note

      - name: Check generated content is committed
        run: git diff --exit-code content/generated content/intermediate/japanese-note reports

      - name: Test frontend
        run: npm test

      - name: Build
        run: npm run build
